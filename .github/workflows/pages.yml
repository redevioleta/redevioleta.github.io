name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout latest Rede Violeta frontend
        uses: actions/checkout@v4
        with:
          repository: Cleysonvieira635/rede-violeta
          ref: main
          path: source

      - uses: actions/configure-pages@v4

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp source/index.html _site/
          cp source/app.js _site/
          cp source/language.js _site/
          cp source/chat-widget.js _site/
          cp source/style.css _site/
          cp source/manifest.webmanifest _site/
          cp source/service-worker.js _site/
          cp -r source/img _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
